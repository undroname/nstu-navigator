<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Питание | НГТУ НЭТИ Навигатор</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <header>
        <div class="nav-container">
            <a href="index.html" class="logo">НГТУ<span>.</span>НЭТИ Навигатор</a>
            <nav>
                <a href="index.html" class="nav-btn">Главная</a>
                <a href="docs.html" class="nav-btn">Документы</a>
                <a href="food.html" class="nav-btn active">Питание</a>
                <a href="tips.html" class="nav-btn">Напутствия</a>
            </nav>
        </div>
    </header>
    <div class="main-content">
        <h1>Питание: Инженерный рацион</h1>
        <p style="color: var(--text-light); margin-bottom: 30px;">Карта проверенных мест для сытного обеда на территории кампуса.</p>
        
        <div class="food-grid" id="food-container"><p>Загрузка меню и столовых...</p></div>
        
        <div class="tips-block">
            <h3>Советы по питанию:</h3>
            <p id="food-tip">Загрузка лайфхака...</p>
        </div>
    </div>

    <script>
        async function loadFood() {
            try {
                const response = await fetch('./content.json');
                const data = await response.json();
                
                const container = document.getElementById('food-container');
                container.innerHTML = '';

                data.food.places.forEach(place => {
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.innerHTML = `
                        <h3>${place.title}</h3>
                        <div class="price-tag">💸 Средний чек: ${place.price}</div>
                        <p class="pro"><strong>👍 Плюсы:</strong> ${place.pro}</p>
                        <p class="con"><strong>🛑 Минусы:</strong> ${place.con}</p>
                    `;
                    container.appendChild(card);
                });

                document.getElementById('food-tip').innerText = data.food.lunchbox_tip;
            } catch (error) {
                console.error("Ошибка загрузки данных о питании:", error);
            }
        }
        window.addEventListener('DOMContentLoaded', loadFood);
    </script>
</body>
</html>
